name: Daily Isekai Video

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC daily
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read
  actions: read

env:
  UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfontconfig1

      - name: Install Python deps
        run: |
          pip install -r requirements.txt

      - name: Create work dir
        run: mkdir -p work logs

      - name: Run pipeline
        id: pipeline
        run: |
          python main.py
        continue-on-error: true

      - name: Check result
        if: steps.pipeline.outcome == 'failure'
        run: |
          exit_code="${{ steps.pipeline.outputs.exit-code }}"
          if [ "$exit_code" = "2" ]; then
            echo "Quota exceeded — skipping upload, not a failure"
            exit 0
          fi
          echo "Pipeline failed with exit code $exit_code"
          exit 1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 7
